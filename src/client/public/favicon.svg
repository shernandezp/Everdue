    The mark: a cycle that does not close (the recurring obligation), a marker riding the gap where the
    next period falls due, and the check that is the whole point of the product. Drawn once here and
    mirrored by src/components/BrandMark.tsx and scripts/gen-icons.mjs — change the three together.
  -->
  <defs>
    <linearGradient id="everdue-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c6ef5" />
      <stop offset="1" stop-color="#0ca678" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#everdue-tile)" />
  <path
    d="M26.05 14.23A10.2 10.2 0 1 1 19.49 6.42"
