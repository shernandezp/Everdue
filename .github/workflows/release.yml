name: Release

# Tagging vX.Y.Z produces everything an installer needs without a toolchain: one archive per
# platform on the GitHub release, and the Docker image on GHCR. CI (ci.yml) stays the gatekeeper
# for correctness; this workflow only packages what a tag says is ready.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and attach the archives
  packages: write   # push the image to GHCR

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  binaries:
    name: Publish ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same list deploy/publish.ps1 accepts.
        runtime: [win-x64, linux-x64, linux-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      # Mirrors deploy/publish.ps1: -p:BuildClient=true runs npm ci + build inside the publish, so
      # the output is the executable plus appsettings.json plus wwwroot — the whole install.
      - name: Publish single-file, self-contained
        run: >-
          dotnet publish src/Server/Everdue.Server.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --output artifacts/${{ matrix.runtime }}
          -p:SelfContainedPublish=true
          -p:BuildClient=true

      # zip for Windows, tar.gz elsewhere — tar preserves the executable bit, which the Linux and
      # macOS binaries need to survive the download.
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="everdue-${version}-${{ matrix.runtime }}"
          mkdir -p artifacts/archives
          case "${{ matrix.runtime }}" in
            win-*) (cd "artifacts/${{ matrix.runtime }}" && zip -qr "../archives/${name}.zip" .) ;;
            *)     tar -czf "artifacts/archives/${name}.tar.gz" -C "artifacts/${{ matrix.runtime }}" . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.runtime }}
          path: artifacts/archives/*
          retention-days: 7

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives

      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          generate_release_notes: true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository path, and the version tag drops the leading "v" so
      # `docker pull ghcr.io/…/everdue:1.2.3` matches the release name.
      - name: Image name and version
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/everdue" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
